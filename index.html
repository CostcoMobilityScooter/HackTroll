body {
  margin: 0;
  background: black;
  overflow: hidden;
  font-family: monospace;

  display: flex;
  justify-content: center;
}

#screen {
  color: #00ff00;

  width: 70%;
  max-width: 900px;
  height: 100vh;

  padding: 40px;

  font-size: 14px;
  line-height: 1.6;

  white-space: pre-wrap;
  word-break: break-word;
}
